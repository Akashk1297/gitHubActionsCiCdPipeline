apiVersion: apps/v1
kind: Deployment
metadata:
  name: myPythonDeployment
  namespace: default
  labels:
    app: python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: mycon
        image: akashk1297/test_repo/github_actions_cicd_pipeline:v1
        ports: 
        - containerPort: 8080
        
  
