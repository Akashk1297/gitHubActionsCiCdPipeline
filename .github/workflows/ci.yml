name: Python CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------
  # Continuous Integration (CI) Stage: Test & Lint
  # -------------------------------------------------------
  continuous-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test across actively supported Python environments
        python-version: ["3.12"]

    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # Automatically caches pip packages based on dependency files
        cache: 'pip' 

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff pytest

    - name: Build python app
      run: |
        echo "Build step to be added later"
        
    - name: Lint Code Base & fix using Ruff
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        pipx run ruff check --fix .

    - name: Execute Test Suite (Pytest)
      run: |
        pytest

    - name: Build the Docker image
      run: docker build -t akashk1297/github_actions_cicd_pipeline:v1 .

    - name: Push the Docker image to DockerHub
      env:
        DOCKER_HUB_LOGIN_USER: "${{secrets.DOCKER_HUB_LOGIN_USER}}"
        DOCKER_HUB_LOGIN_PASSWORD: "${{secrets.DOCKER_HUB_LOGIN_PASSWORD}}"
      run: |
        echo "$DOCKER_HUB_LOGIN_PASSWORD" | docker login -u $DOCKER_HUB_LOGIN_USER --password-stdin
        docker push akashk1297/github_actions_cicd_pipeline:v1
      
  # -------------------------------------------------------
  # Continuous Deployment (CD) Stage: Release to Cloud
  # -------------------------------------------------------
  continuous-deployment:
    needs: continuous-integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out Repository Code
      uses: actions/checkout@v4

  # Install kubectl CLI on the runner
    - name: Setup kubectl
      uses: azure/setup-kubectl@v4
      with:
       version: 'v1.30.0' # Specify your cluster version
       
  # Example command utilizing kubectl
    - name: Check Cluster Nodes
      run: |
        kubectl get nodes
          
    # EXAMPLE: Deploy to platforms like Heroku, AWS, or Azure
    # Ensure variables like API keys are kept safe in your Repository Secrets
    - name: Deploy app to Production
      env:
        DEPLOY_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
      run: |
        echo "Executing secure deployment scripts here..."
        kubectl apply -f deployment.yaml
